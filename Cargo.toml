[package]
name = "pendesk-native"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A stylus-first Debian desktop prototype built with Rust, Qt 6/QML, and CXX-Qt."

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
